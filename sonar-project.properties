# Caminho do relatório de cobertura LCOV gerado pelo Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Excluir arquivo que usa Tailwind CSS das análises do SonarQube
sonar.exclusions=src/styles/globals.scss

# Arquivos excluídos da medição de cobertura (alinhado com vitest.config.ts)
sonar.coverage.exclusions=\
  **/.next/**,\
  src/components/ui/**,\
  src/const.ts,\
  src/app/api/**,\
  src/lib/auth/__tests__/**,\
  src/__mocks__/**,\
  **/types/**,\
  **/_material/**,\
  **/testes/**,\
  next.config.mjs,\
  cypress.config.js,\
  tailwind.config.js,\
  postcss.config.mjs,\
  src/lib/zod-i18n.ts,\
  next-env.d.ts,\
  vitest.config.ts,\
  eslint.config.mjs,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/mockData.ts

# Configurações adicionais para ignorar regras CSS específicas
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4084
sonar.issue.ignore.multicriteria.e1.resourceKey=src/styles/globals.scss
sonar.issue.ignore.multicriteria.e2.ruleKey=css:unknown-at-rule
sonar.issue.ignore.multicriteria.e2.resourceKey=src/styles/globals.scss
