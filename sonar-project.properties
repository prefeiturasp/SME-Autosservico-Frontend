# Caminho do relatório de cobertura LCOV gerado pelo Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Excluir arquivos de teste da análise principal
sonar.exclusions=src/styles/globals.scss,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/**/__tests__/**,src/__mocks__/**,src/setupTests.ts,src/lib/zod-i18n.ts,src/types/**,src/components/ui/**,src/assets/icons/**,testes/**

# Arquivos excluídos da análise de cobertura (alinhado com vitest.config.ts)
sonar.coverage.exclusions=\
  src/components/ui/**,\
  src/const.ts,\
  src/app/api/**,\
  src/lib/auth/__tests__/**,\
  src/__mocks__/**,\
  src/types/**,\
  src/lib/zod-i18n.ts,\
  src/middleware.ts,\
  src/setupTests.ts,\
  src/assets/**,\
  src/components/dashboard/PeakHoursChart/**,\
  src/components/dashboard/Sidebar/**,\
  src/styles/**,\
  src/app/layout.tsx,\
  src/app/(login)/page.tsx,\
  src/components/dashboard/SessionGuard.tsx,\
  src/lib/QueryProvider.tsx

# tour-steps.ts contém apenas arrays de configuração estática com estrutura repetitiva por natureza
sonar.cpd.exclusions=src/states/tour-steps.ts

# Configurações adicionais para ignorar regras CSS específicas
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4084
sonar.issue.ignore.multicriteria.e1.resourceKey=src/styles/globals.scss
sonar.issue.ignore.multicriteria.e2.ruleKey=css:unknown-at-rule
sonar.issue.ignore.multicriteria.e2.resourceKey=src/styles/globals.scss
